name: Refresh course catalogs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_catalogs.py"
  schedule:
    - cron: "17 12 * * 1-5"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_catalogs.py
      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogs.js
          git diff --cached --quiet || git commit -m "Refresh course catalogs"
          git push
